# Base de datos SOLO para las pruebas de integración (puerto 5433; la de desarrollo usa el 5432).
# Los datos viven en memoria (tmpfs): se pierden al apagarla, que es justo lo que se quiere.
# Estas credenciales son de una base desechable local, no de un entorno real.
name: parqueadero-lpr-test
services:
  db-test:
    image: postgres:16-alpine
    container_name: parqueadero-db-test
    environment:
      POSTGRES_USER: parqueadero
      POSTGRES_PASSWORD: parqueadero
      POSTGRES_DB: parqueadero_test
      TZ: UTC
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parqueadero -d parqueadero_test"]
      interval: 3s
      timeout: 3s
      retries: 10